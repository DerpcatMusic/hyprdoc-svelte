<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- INVASIVE SEO & AI INDEXING -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="gptbot" content="index, follow">
    <meta name="google-site-verification" content="verify-me" />
    
    <!-- CRITICAL PERFORMANCE: Preconnects -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    
    <!-- OPTIMIZED FONT LOADING: Reduced weights, Preload -->
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=zodiak@700,900&f[]=alpino@400,500,700,800&display=swap" as="style">
    <link href="https://api.fontshare.com/v2/css?f[]=zodiak@700,900&f[]=alpino@400,500,700,800&display=swap" rel="stylesheet">
    
    <!-- SPECULATION RULES: Instant Page Loads -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "document",
            "where": { "href_matches": "/*" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
