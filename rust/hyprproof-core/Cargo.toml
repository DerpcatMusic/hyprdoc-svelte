[package]
name = "hyprproof-core"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
